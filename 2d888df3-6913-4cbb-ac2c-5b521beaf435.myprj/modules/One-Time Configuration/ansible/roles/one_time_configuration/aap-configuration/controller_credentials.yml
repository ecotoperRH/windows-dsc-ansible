---
controller_credentials:
- name: Domain Controller Admin Credential - one_time_configuration
  description: Credential for one_time_configuration
  organization: Default
  credential_type: Domain Controller Admin Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Domain Controller Join Credential - one_time_configuration
  description: Credential for one_time_configuration
  organization: Default
  credential_type: Domain Controller Join Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Domain Join Credential - one_time_configuration
  description: Credential for one_time_configuration
  organization: Default
  credential_type: Domain Join Credential
  update_secrets: true
  inputs:
    username: '{{ username }}'
    password: '{{ vault_password }}'
- name: Temporary User Password - one_time_configuration
  description: Credential for one_time_configuration
  organization: Default
  credential_type: Temporary User Password
  update_secrets: true
  inputs:
    password: '{{ vault_password }}'
