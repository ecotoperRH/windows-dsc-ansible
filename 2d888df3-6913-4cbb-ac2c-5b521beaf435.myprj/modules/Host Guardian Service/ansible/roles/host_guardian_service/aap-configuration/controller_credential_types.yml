---
controller_credential_types:
- name: HGS Certificate
  description: Credential type for HGS Certificate
  kind: cloud
  inputs:
    fields:
    - id: certificate_path
      type: string
      label: Certificate Path
      help_text: Path to the HGS certificate PFX file
    - id: certificate_password
      type: string
      label: Certificate Password
      secret: true
      help_text: Password for the HGS certificate PFX file
    required:
    - certificate_path
    - certificate_password
  injectors:
    extra_vars:
      certificate_path: !unsafe '{{ certificate_path }}'
      certificate_password: !unsafe '{{ certificate_password }}'
- name: Root Certificate
  description: Credential type for Root Certificate
  kind: cloud
  inputs:
    fields:
    - id: root_certificate_path
      type: string
      label: Root Certificate Path
      help_text: Path to the Root certificate PEM file for proxy access
    required:
    - root_certificate_path
  injectors:
    extra_vars:
      root_certificate_path: !unsafe '{{ root_certificate_path }}'
- name: Directory Services Restore Mode
  description: Credential type for Directory Services Restore Mode
  kind: cloud
  inputs:
    fields:
    - id: dsrm_password
      type: string
      label: DSRM Password
      secret: true
      help_text: Directory Services Restore Mode password for the HGS domain
    required:
    - dsrm_password
  injectors:
    extra_vars:
      dsrm_password: !unsafe '{{ dsrm_password }}'
- name: Domain Controller Admin
  description: Credential type for Domain Controller Admin
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Domain controller administrator username
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Domain controller administrator password
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Domain Controller Join
  description: Credential type for Domain Controller Join
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for domain controller join operations
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for domain controller join operations
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Domain Join
  description: Credential type for Domain Join
  kind: cloud
  inputs:
    fields:
    - id: username
      type: string
      label: Username
      help_text: Username for domain join operations
    - id: password
      type: string
      label: Password
      secret: true
      help_text: Password for domain join operations
    required:
    - username
    - password
  injectors:
    extra_vars:
      username: !unsafe '{{ username }}'
      password: !unsafe '{{ password }}'
- name: Temporary User Password
  description: Credential type for Temporary User Password
  kind: cloud
  inputs:
    fields:
    - id: temp_password
      type: string
      label: Temporary Password
      secret: true
      help_text: Temporary password used for user creation
    required:
    - temp_password
  injectors:
    extra_vars:
      temp_password: !unsafe '{{ temp_password }}'
