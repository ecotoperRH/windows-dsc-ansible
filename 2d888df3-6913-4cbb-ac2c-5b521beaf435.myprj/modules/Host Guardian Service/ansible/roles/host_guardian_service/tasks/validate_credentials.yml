---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - certificate_path is defined
      - certificate_password is defined
      - root_certificate_path is defined
      - dsrm_password is defined
      - username is defined
      - password is defined
      - temp_password is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
